# ────────────────────────────────────────────────────────────
# Hyprland — T1 Light
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgb(0762B4)
    col.inactive_border = rgb(DDD8CA)
    border_size = 6
    gaps_in = 5
    gaps_out = 5
}

group {
    col.border_active = rgba(0762B4ee)
    col.border_inactive = rgb(DDD8CA)

    groupbar {
        col.active = rgba(0762B499)
        col.inactive = rgba(DDD8CA88)
        text_color = rgb(1A1A18)
        text_color_inactive = rgba(0762B4ee)
    }
}

decoration {
  rounding = 4
  rounding_power = 3
  shadow {
  enabled = yes
  render_power = 8
  range = 16
  color = rgba(00000033)
  }
}
